version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/guest
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one weekly PR. Major versions
    # (crypto, Tauri, Wasmtime, JNI) are upgraded deliberately, with review.
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
