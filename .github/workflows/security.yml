name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified secret scanner
        run: python3 scripts/install-gitleaks.py "$RUNNER_TEMP/secret-scanner"
      - name: Scan commit history with redaction
        run: '"$RUNNER_TEMP/secret-scanner/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'
      - name: Install pinned RustSec scanner outside the checkout
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/security-tools"
      - name: Audit locked dependencies (known findings recorded, nothing new allowed)
        # RUSTSEC-2024-0429 (glib unsoundness) is the one recorded finding. It is
        # outside the arm64 macOS/Android graphs (checked by
        # scripts/dependency_exposure.py in Host checks) and stays visible in
        # the strict-audit job below. Any other vulnerability, unsound or
        # yanked crate fails this job.
        run: |
          "$RUNNER_TEMP/security-tools/bin/cargo-audit" audit --deny unsound --deny yanked \
            --ignore RUSTSEC-2024-0429

  strict-audit:
    name: strict audit (informational, no ignores)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reports every open finding, including the recorded glib one, without
    # blocking merges. Releases must list its findings; see docs/releasing.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned RustSec scanner outside the checkout
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/security-tools"
      - name: Audit locked dependencies (no advisory ignores)
        run: |
          "$RUNNER_TEMP/security-tools/bin/cargo-audit" audit --deny unsound --deny yanked
