name: Pinned plugin integration
on:
  workflow_dispatch:
    inputs:
      plugins_repository:
        description: 'Plugins GitHub owner/repository'
        required: true
      plugins_ref:
        description: 'Exact plugins commit SHA to test'
        required: true
permissions:
  contents: read
jobs:
  integration:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: host
      - name: Require an exact plugin commit
        env:
          PLUGINS_REF: ${{ inputs.plugins_ref }}
          PLUGINS_REPOSITORY: ${{ inputs.plugins_repository }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-fA-F]{40}', os.environ['PLUGINS_REF']), 'Use a full commit SHA'
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ['PLUGINS_REPOSITORY']), 'Use owner/repository'
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ inputs.plugins_repository }}
          ref: ${{ inputs.plugins_ref }}
          path: plugins
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: rustup show
        working-directory: host
      - run: cargo build --locked -p terra
        working-directory: host
      - name: Build and validate plugin release
        run: python3 plugins/scripts/build-release.py --terra host/target/debug/terra --output plugins/releases/ci
      - run: python3 scripts/import-plugins.py ../plugins/releases/ci --update-lock
        working-directory: host
      - name: Cross-repository tests
        env:
          TERRA_PLUGIN_SOURCE: ${{ github.workspace }}/plugins/packages
          TERRA_HOST_SOURCE: ${{ github.workspace }}/host
        run: |
          cargo test --locked --workspace --features terrarium-runtime/plugin-integration
          node --test ui/tests/*.test.cjs ../plugins/tests/*.test.cjs
          python3 -m unittest discover -s ../plugins/packages/notes/tests -p '*_query.py'
        working-directory: host
      - run: cargo clippy --locked --workspace --all-targets --features terrarium-runtime/plugin-integration -- -D warnings
        working-directory: host
      - name: Check reviewed dependency exposure has not drifted
        run: python3 scripts/dependency_exposure.py --target aarch64-apple-darwin
        working-directory: host
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build desktop bundle
        run: cargo tauri build --debug --bundles app --config '{"bundle":{"active":true}}'
        working-directory: host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-bundle
          path: plugins/releases/ci
